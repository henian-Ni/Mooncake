name: Pre-Release
run-name: Memfabric pre-release validation (${{ github.ref_name }})
'on':
  push:
    tags:
    - v*-rc*
    - v*-alpha*
    - v*-beta*
    - v*-pre*
jobs:
  version-stamp:
    name: Normalize pre-release version
    if: github.repository == 'henian-Ni/Mooncake'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
    - name: Checkout release gate
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install version parser
      run: python -m pip install packaging
    - name: Normalize tag as a PEP 440 pre-release
      id: version
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        normalized=$(python scripts/ci/testpypi_wheel_gate.py \
          normalize-version --tag "$RELEASE_TAG")
        echo "package_version=${normalized}" >> "$GITHUB_OUTPUT"
        echo "Normalized ${RELEASE_TAG} to ${normalized}"
  build-memfabric:
    name: Build Memfabric wheels
    needs: version-stamp
    permissions:
      contents: read
    uses: ./.github/workflows/_build-memfabric-wheel.yaml
    with:
      artifact-prefix: mooncake-memfabric-wheel-pre-release
      version-override: ${{ needs.version-stamp.outputs.package_version }}
  publish-github-release:
    name: Create validation GitHub Pre-release
    needs: version-stamp
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Create GitHub Pre-release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        prerelease: true
        make_latest: false
        body: Memfabric pre-release validation. TestPyPI and production PyPI uploads are disabled in this isolated test branch.
  publish-memfabric-wheels:
    name: Publish Memfabric wheels (best-effort)
    needs:
    - build-memfabric
    - publish-github-release
    if: ${{ !cancelled() && needs.publish-github-release.result == 'success' }}
    runs-on: ubuntu-22.04
    concurrency:
      group: pre-release-memfabric-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
    - name: Download Memfabric wheel artifacts
      uses: actions/download-artifact@v4
      with:
        path: mooncake-wheel/dist-memfabric
        pattern: mooncake-memfabric-wheel-pre-release-*
        merge-multiple: true
    - name: Collect Memfabric wheels and check coverage
      run: |
        set -euo pipefail
        mkdir -p mooncake-wheel/dist-memfabric mooncake-wheel/dist-release
        find mooncake-wheel/dist-memfabric -name "*.whl" -exec cp {} mooncake-wheel/dist-release/ \;
        count=$(find mooncake-wheel/dist-release -name "*.whl" | wc -l)
        echo "Collected ${count} Memfabric wheel(s):"
        find mooncake-wheel/dist-release -name "*.whl" -exec ls -la {} \;
        if [ "${count}" -eq 0 ]; then
          echo "::warning::No Memfabric wheels were produced; skipping Memfabric publication."
          echo "PUBLISH_MEMFABRIC=no" >> "$GITHUB_ENV"
          exit 0
        fi
        echo "PUBLISH_MEMFABRIC=yes" >> "$GITHUB_ENV"
        if [ "${count}" -lt 10 ]; then
          echo "::warning::Partial Memfabric wheel set (${count}/10 expected for 2 arches x 5 Pythons); publishing what exists."
        fi
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Validate Memfabric wheels with twine
      if: env.PUBLISH_MEMFABRIC == 'yes'
      run: |
        python -m pip install twine
        twine check mooncake-wheel/dist-release/*.whl
    - name: Append Memfabric wheels to GitHub Pre-release
      if: env.PUBLISH_MEMFABRIC == 'yes'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        prerelease: true
        make_latest: false
        files: mooncake-wheel/dist-release/*.whl
        fail_on_unmatched_files: true
