name: _build-memfabric-wheel

# Shared Memfabric wheel build for stable and pre-release workflows.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Source ref to build; defaults to the triggering ref'
        type: string
        default: ''
      artifact-prefix:
        type: string
        default: mooncake-wheel-memfabric
      version-override:
        description: 'Optional wheel version override for pre-release builds'
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch: [aarch64, x86_64]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          - arch: aarch64
            runner: ubuntu-22.04-arm
            cann_arch: aarch64
          - arch: x86_64
            runner: ubuntu-22.04
            cann_arch: x86_64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    env:
      MEMFABRIC_BUILD: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set Python bin
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python${{ matrix.python-version }})"
          "$PYTHON_BIN" --version
          "$PYTHON_BIN" -m pip --version
          echo "PYTHON_BIN=${PYTHON_BIN}" >> "$GITHUB_ENV"

      - name: Install CANN Toolkit
        shell: bash
        run: |
          set -euo pipefail
          CANN_BASE_URL="https://ascend.devcloud.huaweicloud.com/cann/run/software"
          CANN_VERSION=$(curl -s "${CANN_BASE_URL}/" | grep -oP '[0-9]+\.[0-9]+\.[0-9]+(?=/)' | sort -V | tail -1)
          echo "Latest CANN version: ${CANN_VERSION}"
          CANN_URL="${CANN_BASE_URL}/${CANN_VERSION}/${{ matrix.cann_arch }}/Ascend-cann-toolkit_${CANN_VERSION}_linux-${{ matrix.cann_arch }}.run"
          echo "Downloading CANN ${CANN_VERSION} from ${CANN_URL}"
          wget -q --show-progress -O /tmp/cann_toolkit.run "${CANN_URL}"
          chmod +x /tmp/cann_toolkit.run
          sudo /tmp/cann_toolkit.run --install --install-for-all --install-path=/usr/local/Ascend --quiet
          rm -f /tmp/cann_toolkit.run

      - name: Install dependencies
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          sudo bash -x dependencies.sh -y
          sudo bash scripts/ascend/dependencies_ascend_installation.sh
          sudo apt-get install -y file
          echo "PATH=/usr/local/go/bin:${PATH}" >> "$GITHUB_ENV"

      - name: Configure project
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          rm -rf build
          cmake -S . -B build -G Ninja \
            -DUSE_TENT=ON \
            -DUSE_MEMFABRIC=ON \
            -DUSE_ETCD=ON \
            -DSTORE_USE_ETCD=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_UNIT_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_DEBUG_SYMBOLS=OFF \
            -DPython3_EXECUTABLE="${PYTHON_BIN}" \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=OFF \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=OFF \
            -DCMAKE_SKIP_INSTALL_RPATH=ON

      - name: Build project
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          export PATH="/usr/local/go/bin:${PATH}"
          # Limit parallelism for memory-heavy Store builds.
          cmake --build build --parallel 2
          sudo cmake --install build

      - name: Generate Python version tag
        id: generate_tag_release
        shell: bash
        run: |
          echo "python_version_tag=$(echo ${{ matrix.python-version }} | tr -d '.')" >> $GITHUB_OUTPUT

      - name: Patch wheel version in pyproject.toml
        if: ${{ inputs.version-override != '' }}
        shell: bash
        env:
          WHEEL_VERSION: ${{ inputs.version-override }}
        run: |
          sed -i "s/^version = .*/version = \"${WHEEL_VERSION}\"/" mooncake-wheel/pyproject.toml
          echo "Patched mooncake-wheel/pyproject.toml version to: ${WHEEL_VERSION}"

      - name: Build Python wheel
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          PYTHON_VERSION=${{ matrix.python-version }} OUTPUT_DIR=dist-memfabric-py${{ steps.generate_tag_release.outputs.python_version_tag }} bash scripts/build_wheel.sh

      - name: Smoke test repaired wheel
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH=""
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          export LD_LIBRARY_PATH=""
          source /usr/local/Ascend/cann/set_env.sh
          export PYTHONPATH=""
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}:/usr/local/lib"
          export MOONCAKE_STORE_BACKEND=cpp
          export WHEEL_DIR="${GITHUB_WORKSPACE}/mooncake-wheel/dist-memfabric-py${{ steps.generate_tag_release.outputs.python_version_tag }}"
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          "${PYTHON_BIN}" -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --no-deps "$WHEEL_DIR"/*.whl
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -I - <<'PY'
          from mooncake import engine, tent
          from mooncake.store import MooncakeDistributedStore
          from pathlib import Path
          import subprocess
          import sysconfig

          package = Path(sysconfig.get_path("platlib")) / "mooncake"
          subprocess.run([str(package / "mooncake_master"), "--version"], check=True)
          print("Memfabric wheel smoke test passed")
          PY

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.arch }}-py${{ steps.generate_tag_release.outputs.python_version_tag }}
          path: mooncake-wheel/dist-memfabric-py${{ steps.generate_tag_release.outputs.python_version_tag }}/*.whl
          if-no-files-found: error
